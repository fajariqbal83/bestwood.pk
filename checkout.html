<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>checkout</title>
    <link rel="stylesheet" href="styles/checkout.css" />
  </head>
  <body>
    <div class="container">
      <div class="title">
        <h2>Product Order Form</h2>
      </div>
      <div class="d-flex">
        <form class="js-form-checkout" action="" method=""></form>
        <div class="Yorder">
          <table class="js-your-orders"></table>
          <br />
          <div>
            <input
              class="js-payment-method"
              type="radio"
              name="dbt"
              value="Direct Bank Transfer"
              checked
            />
            Direct Bank Transfer
          </div>
          <p>
            Make your payment directly into our bank account. Please use your
            Order ID as the payment reference. Your order will not be shipped
            until the funds have cleared in our account.
          </p>
          <div>
            <input
              class="js-payment-method"
              type="radio"
              name="dbt"
              value="Cash on Delivery"
            />
            Cash on Delivery
          </div>
          <div>
            <input
              class="js-payment-method"
              type="radio"
              name="dbt"
              value="Paypal"
            />
            Paypal
          </div>
          <button class="js-place-order" type="button">Place Order</button>
        </div>
        <!-- Yorder -->
      </div>
    </div>

    <script src="scripts/checkout.js" type="module"></script>
  </body>
</html>
